name: Phase 14 Ruff fix

on:
  push:
    branches:
      - phase-14-frontend-showcase

permissions:
  contents: write

jobs:
  fix:
    name: Apply Ruff-only fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout phase 14
        uses: actions/checkout@v4
        with:
          ref: phase-14-frontend-showcase

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install "ruff==0.12.12"

      - name: Apply targeted Ruff fixes
        run: |
          python -m ruff check --fix \
            src/ai_service_desk/web/demo_runtime.py \
            tests/engine/test_semantic_roles.py \
            tests/web/test_local_ai_semantic_acceptance.py
          python -m ruff format \
            src/ai_service_desk/web/demo_runtime.py \
            tests/engine/test_semantic_roles.py \
            tests/web/test_local_ai_semantic_acceptance.py

      - name: Verify repository Ruff gate
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Commit targeted formatting fixes
        run: |
          if git diff --quiet -- \
            src/ai_service_desk/web/demo_runtime.py \
            tests/engine/test_semantic_roles.py \
            tests/web/test_local_ai_semantic_acceptance.py; then
            echo "No targeted Ruff changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_service_desk/web/demo_runtime.py \
            tests/engine/test_semantic_roles.py \
            tests/web/test_local_ai_semantic_acceptance.py
          git commit -m "style: satisfy phase 14 Ruff gate"
          git push origin HEAD:phase-14-frontend-showcase
