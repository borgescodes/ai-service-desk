name: Phase 14 Ruff fix

on:
  push:
    branches:
      - phase-14-frontend-showcase

permissions:
  contents: write

jobs:
  fix:
    name: Apply Ruff-only fixes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout phase 14
        uses: actions/checkout@v4
        with:
          ref: phase-14-frontend-showcase

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install "ruff==0.12.12"

      - name: Apply repository Ruff fixes
        run: |
          python -m ruff check --fix . || true
          python -m ruff format .

      - name: Verify repository Ruff gate
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/phase14-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: satisfy phase 14 Ruff gate"
          git push origin HEAD:phase-14-frontend-showcase
