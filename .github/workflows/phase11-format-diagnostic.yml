name: Phase 11 format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  phase11-format-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: python -m pip install "ruff==0.12.12"
      - name: Ruff format diff
        run: python -m ruff format --diff tests/engine/test_learning_prevention_smoke.py
