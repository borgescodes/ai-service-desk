name: Phase 9 CDM integration

on:
  pull_request:

permissions:
  contents: read

jobs:
  phase9-cdm-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "ruff==0.12.12"
      - name: Create ephemeral CDM token
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print("CDM_API_TOKEN=" + secrets.token_urlsafe(32))
          PY
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Show Ruff format diff
        if: failure()
        run: |
          python -m ruff format .
          git diff -- \
            src/ai_service_desk/engine/cdm_integration_smoke.py \
            src/ai_service_desk/phase9_cli.py \
            tests/engine/test_phase9_security.py
      - name: Historical node ID preservation
        env:
          PHASE9_BASELINE_SHA: fd48e294617ea4d4cff91effeec507abbf44e4d5
        run: |
          python -m pytest --collect-only -q > "$RUNNER_TEMP/phase9-candidate-nodeids.txt"
          git worktree add --detach "$RUNNER_TEMP/phase9-baseline" "$PHASE9_BASELINE_SHA"
          (
            cd "$RUNNER_TEMP/phase9-baseline"
            PYTHONPATH=src python -m pytest --collect-only -q \
              > "$RUNNER_TEMP/phase9-baseline-nodeids.txt"
          )
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])

          def node_ids(name):
              return [
                  line.strip()
                  for line in (root / name).read_text(encoding="utf-8").splitlines()
                  if "::" in line
              ]

          historical = node_ids("phase9-baseline-nodeids.txt")
          candidate = node_ids("phase9-candidate-nodeids.txt")
          candidate_set = set(candidate)
          missing = [node_id for node_id in historical if node_id not in candidate_set]
          print(f"historical_node_ids={len(historical)}")
          print(f"candidate_node_ids={len(candidate)}")
          print(f"missing_historical_node_ids={len(missing)}")
          print(f"new_node_ids={len(candidate) - len(historical)}")
          if len(historical) != 701 or missing:
              raise SystemExit("Phase 9 historical node ID preservation failed")
          PY
          git worktree remove "$RUNNER_TEMP/phase9-baseline" --force
      - name: Full pytest
        run: python -m pytest -q
      - name: Phase 9 smoke
        run: |
          python -m ai_service_desk cdm-integration-smoke \
            --cases tests/fixtures/phase9_cdm_integration_cases.jsonl \
            --report "$RUNNER_TEMP/phase9-cdm-integration.json"
