name: Phase 2 format plan

on:
  push:
    branches:
      - phase-2-real-corpus

permissions:
  contents: write

jobs:
  format-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-2-real-corpus
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Format plan
        run: |
          python -m pip install ruff==0.16.6
          python -m ruff format docs/superpowers/plans/2026-09-06-phase-2-real-ti-corpus-retrieval.md
          git rm .github/workflows/phase2-format-plan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-06-phase-2-real-ti-corpus-retrieval.md
          git commit -m "docs: format phase 2 implementation plan"
          git push origin HEAD:phase-2-real-corpus
