name: Format phase 3 plan

on:
  push:
    branches:
      - phase-3-evaluation-calibration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-3-evaluation-calibration
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.6
      - run: python -m ruff format docs/superpowers/plans/2026-09-07-phase-3-evaluation-calibration.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-07-phase-3-evaluation-calibration.md
          git commit -m "style: format phase 3 plan"
          git push origin HEAD:phase-3-evaluation-calibration
