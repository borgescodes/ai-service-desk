name: Phase 14 final self-hosted gate

on:
  push:
    branches:
      - phase-14-frontend-showcase

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: [self-hosted, Windows, X64, ai-service-desk, ollama]
    timeout-minutes: 45
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: phase-14-frontend-showcase
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install project
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "ruff==0.12.12"

      - name: Runtime versions
        shell: powershell
        run: |
          python --version
          python -m ruff --version
          node --version
          (Invoke-RestMethod http://localhost:11434/api/tags).models | Select-Object name

      - name: Apply verified Phase 14 repair
        shell: powershell
        run: python .github/scripts/phase14_repair.py

      - name: Format and lint repaired tree
        shell: powershell
        run: |
          python -m ruff check --fix .
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
          git diff --check

      - name: Targeted repaired regressions
        shell: powershell
        run: |
          python -m pytest `
            tests/engine/test_policy_smoke.py `
            tests/web/test_business_qa_regressions.py `
            tests/web/test_conversational_ai.py `
            tests/web/test_focused_demo_contract.py `
            tests/web/test_web_demo_smoke.py `
            -q

      - name: Full Python suite
        shell: powershell
        run: python -m pytest -q

      - name: Frontend lint
        shell: powershell
        run: node web/scripts/lint.mjs

      - name: Frontend tests
        shell: powershell
        run: node --test web/tests/*.test.mjs

      - name: Frontend build
        shell: powershell
        run: node web/scripts/build.mjs

      - name: Phase 14 targeted hotfix regressions
        shell: powershell
        run: |
          python -m pytest `
            tests/web/test_semantic_handoff_contract.py::test_material_registration_never_becomes_cdm_access_request `
            tests/web/test_business_context_runtime.py::test_runtime_contextual_cdm_handoffs_without_fabricating_access_or_knowledge `
            -q

      - name: Real Qwen semantic acceptance
        shell: powershell
        env:
          JUP_RUN_LOCAL_AI_QA: "1"
        run: python -m pytest tests/web/test_local_ai_semantic_acceptance.py -q

      - name: Commit verified repair and remove temporary gate
        shell: powershell
        run: |
          Remove-Item .github/workflows/phase14-final-self-hosted.yml
          Remove-Item .github/scripts/phase14_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile phase 14 semantic contracts"
          git push origin HEAD:phase-14-frontend-showcase
          $status = git status --porcelain
          if ($status) { throw "Working tree is not clean after verified commit" }
