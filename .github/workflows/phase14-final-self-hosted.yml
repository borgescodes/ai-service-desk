name: Phase 14 final self-hosted gate

on:
  push:
    branches:
      - phase-14-frontend-showcase

permissions:
  contents: write

jobs:
  final-gate:
    runs-on: [self-hosted, Windows, X64, ai-service-desk, ollama]
    timeout-minutes: 30
    env:
      PYTHONPATH: src

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: phase-14-frontend-showcase
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "ruff==0.12.12"

      - name: Runtime versions
        shell: pwsh
        run: |
          python --version
          python -m ruff --version
          node --version
          (Invoke-RestMethod http://localhost:11434/api/tags).models | Select-Object name

      - name: Ruff lint
        shell: pwsh
        run: python -m ruff check .

      - name: Ruff format
        shell: pwsh
        run: python -m ruff format --check .

      - name: Full Python suite
        shell: pwsh
        run: python -m pytest -q

      - name: Frontend lint
        shell: pwsh
        run: node web/scripts/lint.mjs

      - name: Frontend tests
        shell: pwsh
        run: node --test web/tests/*.test.mjs

      - name: Frontend build
        shell: pwsh
        run: node web/scripts/build.mjs

      - name: Phase 14 targeted hotfix regressions
        shell: pwsh
        run: |
          python -m pytest `
            tests/web/test_semantic_handoff_contract.py::test_material_registration_never_becomes_cdm_access_request `
            tests/web/test_business_context_runtime.py::test_runtime_contextual_cdm_handoffs_without_fabricating_access_or_knowledge `
            -q

      - name: Real Qwen semantic acceptance
        shell: pwsh
        env:
          JUP_RUN_LOCAL_AI_QA: "1"
        run: python -m pytest tests/web/test_local_ai_semantic_acceptance.py -q

      - name: Working tree clean
        shell: pwsh
        run: |
          $status = git status --porcelain
          $status
          if ($status) { throw "Working tree is not clean" }

      - name: Remove temporary gate after success
        shell: pwsh
        run: |
          Remove-Item .github/workflows/phase14-final-self-hosted.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "ci: remove phase 14 final self-hosted gate"
          git push origin HEAD:phase-14-frontend-showcase
