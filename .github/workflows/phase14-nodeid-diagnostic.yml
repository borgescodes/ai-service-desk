name: Phase 14 node ID diagnostic

on:
  push:
    branches:
      - phase-14-frontend-showcase

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PHASE9_BASELINE_SHA: fd48e294617ea4d4cff91effeec507abbf44e4d5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Print missing historical node IDs
        run: |
          python -m pytest --collect-only -q > "$RUNNER_TEMP/candidate-nodeids.txt"
          git worktree add --detach "$RUNNER_TEMP/baseline" "$PHASE9_BASELINE_SHA"
          (
            cd "$RUNNER_TEMP/baseline"
            PYTHONPATH=src python -m pytest --collect-only -q > "$RUNNER_TEMP/baseline-nodeids.txt"
          )
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])

          def node_ids(name):
              return [
                  line.strip()
                  for line in (root / name).read_text(encoding="utf-8").splitlines()
                  if "::" in line
              ]

          historical = node_ids("baseline-nodeids.txt")
          candidate = node_ids("candidate-nodeids.txt")
          candidate_set = set(candidate)
          missing = [node_id for node_id in historical if node_id not in candidate_set]
          print(f"historical_node_ids={len(historical)}")
          print(f"candidate_node_ids={len(candidate)}")
          print(f"missing_historical_node_ids={len(missing)}")
          for node_id in missing:
              print(f"MISSING_NODE_ID={node_id}")
          PY
