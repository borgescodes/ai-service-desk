name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: phase6-format-diagnostic

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply Ruff formatting
        run: |
          python -m ruff format .
          python -m ruff check --fix .
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .

      - name: Commit diagnostic formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-09-08-phase-6-playbooks.md \
            src/ai_service_desk/engine/playbook.py \
            src/ai_service_desk/engine/playbook_resolution.py \
            src/ai_service_desk/engine/playbook_smoke.py \
            tests/engine/test_playbook.py \
            tests/engine/test_playbook_resolution.py \
            tests/engine/test_playbook_smoke.py \
            tests/test_playbook_cli.py
          git commit -m "style: format phase 6 plan snippets"
          git push origin HEAD:phase6-format-diagnostic
