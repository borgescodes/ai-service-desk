name: Phase 3 evaluation

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch or SHA to validate
        required: true
        type: string
      report_path:
        description: Aggregate evaluation report outside the repository checkout
        required: true
        default: 'C:\ai-service-desk-data\phase-3\reports\phase3-evaluation.json'
        type: string
      demo_root:
        description: Existing Phase 2A demo root outside the repository checkout
        required: true
        default: 'C:\ai-service-desk-data\phase-2\demo'
        type: string

permissions:
  contents: read

jobs:
  phase3-evaluation:
    name: Windows Phase 3 evaluation
    runs-on: [self-hosted, Windows, X64, ai-service-desk, ollama]
    timeout-minutes: 30

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Verify Python 3.14
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $version = python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))"
          Write-Host "Python: $version"
          if (-not $version.StartsWith("3.14.")) {
            throw "Phase 3 evaluation requires Python 3.14.x. Found $version"
          }

      - name: Install project
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify local models
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          python -m ai_service_desk doctor --url http://127.0.0.1:11434

      - name: Prepare local paths
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $index = Join-Path $env:RUNNER_TEMP "phase3-evaluation-index"
          if (Test-Path $index) {
            Remove-Item -Recurse -Force $index
          }
          $reportPath = "${{ inputs.report_path }}"
          $reportDir = Split-Path -Parent $reportPath
          New-Item -ItemType Directory -Force $reportDir | Out-Null

      - name: Build synthetic evaluation index
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $index = Join-Path $env:RUNNER_TEMP "phase3-evaluation-index"
          python -m ai_service_desk index `
            --file tests/fixtures/phase3_eval_corpus.csv `
            --index "$index" `
            --batch-size 10 `
            --url http://127.0.0.1:11434

      - name: Run synthetic benchmark and calibration decision
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $index = Join-Path $env:RUNNER_TEMP "phase3-evaluation-index"
          python -m ai_service_desk evaluate `
            --index "$index" `
            --cases tests/fixtures/phase3_eval_cases.jsonl `
            --report "${{ inputs.report_path }}" `
            --checkout "$env:GITHUB_WORKSPACE" `
            --url http://127.0.0.1:11434

      - name: Validate existing Phase 2A demo safety invariants
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $demoRoot = "${{ inputs.demo_root }}"
          $subset = Join-Path $demoRoot "demo_subset.csv"
          $subsetReport = Join-Path $demoRoot "reports\subset.json"
          $demoIndex = Join-Path $demoRoot "index"
          $phase3ReportDir = Split-Path -Parent "${{ inputs.report_path }}"
          $smokeReport = Join-Path $phase3ReportDir "phase3-demo-smoke.json"

          if (-not (Test-Path $subset)) {
            throw "Phase 2A demo subset is missing: $subset"
          }
          if (-not (Test-Path $subsetReport)) {
            throw "Phase 2A subset report is missing: $subsetReport"
          }
          if (-not (Test-Path $demoIndex)) {
            throw "Phase 2A demo index is missing: $demoIndex"
          }

          python -m ai_service_desk demo-smoke `
            --file "$subset" `
            --subset-report "$subsetReport" `
            --index "$demoIndex" `
            --report "$smokeReport" `
            --checkout "$env:GITHUB_WORKSPACE" `
            --url http://127.0.0.1:11434
