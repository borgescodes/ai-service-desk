name: Phase 1 formatter once

on:
  push:
    branches:
      - phase-1-engine-implementation

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'chore: run phase 1 formatter'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: phase-1-engine-implementation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format and verify
        run: |
          python -m ruff format src tests
          python -m ruff check src tests --fix
          python -m pytest

      - name: Commit formatting
        run: |
          if git diff --quiet -- src tests; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: satisfy phase 1 python quality"
          git push origin HEAD:phase-1-engine-implementation
